main{max-width:640px;margin:0 auto;padding:12px 14px 40px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:2}
nav button{flex:1 1 calc(50% - 6px);min-width:84px;padding:12px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font:inherit;font-weight:500;font-size:14px}
nav button[aria-selected="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.home-title{display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;letter-spacing:.5px;margin:28px 0 2px;text-align:center;color:var(--brand);font-stretch:condensed}

.brand-o::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-42%,-50%);width:0;height:0;border-style:solid;border-width:.15em 0 .15em .24em;border-color:transparent transparent transparent #d7182f}

.ghost{padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font:inherit}
.share-btn{width:100%;margin-top:8px;padding:14px;font-size:16px;font-weight:500}
.danger-btn{width:100%;margin-top:8px;padding:14px;font-size:16px;font-weight:500;color:var(--no);border-color:var(--no)}
.toggle-btn{width:100%;margin-top:8px;padding:14px;border:2px solid var(--line);background:var(--card);color:var(--mute);border-radius:6px;font:inherit;font-weight:600;font-size:16px}
.toggle-btn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}

.sheet-back{position:fixed;inset:0;background:rgba(15,20,24,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet-back[hidden]{display:none}
.sheet{width:100%;max-width:640px;background:var(--card);border-radius:10px 10px 0 0;padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet .grabber{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 14px}
.sheet h3{margin:0 0 12px;font-size:14px;font-weight:500;color:var(--mute)}
.sheet a,.sheet button{width:100%;display:flex;align-items:center;gap:12px;padding:13px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;text-align:left;text-decoration:none;box-sizing:border-box}
.sheet a .ic,.sheet button .ic{width:30px;height:30px;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600}
.sheet .cancel{margin-top:4px;background:transparent;border:none;color:var(--mute);justify-content:center;font-weight:500}
.item{position:relative;border-radius:6px;margin-bottom:8px;overflow:hidden}
.item b{font-weight:600}.item small{display:block;color:var(--mute)}
.item-del{position:absolute;top:0;right:0;bottom:0;width:84px;background:var(--no);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.item-body{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 50px 12px 14px;cursor:pointer;transition:transform .18s ease;touch-action:pan-y;box-sizing:border-box}
.item-photo-btn{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--acc);font-size:15px;display:flex;align-items:center;justify-content:center;z-index:1;padding:0}
.item-body.complete{border-left:4px solid var(--ok)}
.item-body.incomplete{border-left:4px solid var(--no)}
.badge-no{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:20px;background:var(--no);color:#fff;font-size:11px;font-weight:600;vertical-align:middle}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.bar .q{flex:1;min-width:120px}
.qf{flex:none;padding:11px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.msg{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
.msg.on{opacity:1}
.status{font-size:12px;color:var(--mute);text-align:center;margin:-6px 0 12px}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;background:var(--mute)}
.status.cloud .dot{background:var(--ok)}
.status.local .dot{background:var(--warm)}
@media (prefers-reduced-motion:reduce){.msg{transition:none}}
</style>

<script>
const SHARE_URL="https://claude.ai/artifact/DWjjWmS1Gq7ruE8wKQSeFV";
const VALID={
 project:{re:/^\d-\d{4}-\d{5}$/,hint:"Just type the 10 digits — hyphens are added automatically (e.g. 0-0000-00000)",ex:"0-0000-00000"},
 line:{re:/^\d{2}[A-Z0-9]{6}$/,hint:"Format: 00ABCDEF (2 digits + 6 letters/digits)",ex:"00ABCDEF"},
 rnum:{re:/^R\d{1,2}$/,hint:"Format: R + number, up to 3 characters (e.g. R1, R2, R12)",ex:"R1"}
};
const EMPLOYEES=["Islam Safarov","Dastan Ideyatov","Mukhamediyar Kinzhenov"];
const EQUIPMENT=["RoGeo MD","RoGeo XT","RoCorr MFL-A","RoCorr UT","RoCorr MFL-C (AFD)","EMAT"];
const G=[
["Project",[["project","Project","text"],["client","Client","text"],["line","Line ID","text"],["rnum","Run No.","text"],["equip","Technology","sel",EQUIPMENT],["operator","Employee","sel",EMPLOYEES],["expspeed","Expected velocity","num","m/s"]]],
["Before Launch",[["on","Switched on","time"],["tx","Transmitter","yn"],["bml","BM L","yn"],["bmdist_bl","BM Distance","num","m"],["lpic","Launcher Picture","yn"],["toolpic_bl","Tool Pictures (Pre-run)","yn"],["pl","Pressure launcher","num","bar"]]],
["Run",[["launched","Launched","time"],["date_on","Date","date"],["bmr","BM R","yn"],["bmdist_run","BM Distance","num","m"],["received","Received","time"],["date_off","Date","date"],["pr","Pressure receiver","num","bar"],["off","Switched off","time"],["rpic","Receiver Picture","yn"],["toolpic_run","Tool Pictures (Post-run)","yn"]]],
["Summary",[["dist","Recorded distance","num","m"],["data","Data","dnum",["GB","MB"]],["duration","Run duration","calc"],["avgspeed","Average velocity","calc"],["notes","Notes","area"]]]];
const F=G.flatMap(g=>g[1]);
let runs=[],editId=null,cloudDb=null,assetsApi=null,photos=[],currentLine=null,pendingKind=null,cleanupRan=false;
const PHOTO_MAX_AGE_MS=180*24*60*60*1000;
const KINDS=[["launcher","Launcher"],["receiver","Receiver"],["prerun","Pre-run"],["postrun","Post-run"]];
try{runs=JSON.parse(localStorage.getItem("runs")||"[]")}catch(e){runs=[]}
const $=id=>document.getElementById(id);
function cacheLocal(){try{localStorage.setItem("runs",JSON.stringify(runs))}catch(e){}}
function setStatus(mode){
 const s=$("status");if(!s)return;
 s.className="status "+mode;
 s.innerHTML="<span class='dot'></span>"+(mode==="cloud"?"Synced — shared with your team":mode==="local"?"Offline — saved on this device only":"Connecting…");
}
async function initCloud(){
 try{assetsApi=window.claude?await window.claude.use("assets"):null}catch(e){assetsApi=null}
 $("pl-add").hidden=!assetsApi;
 let db=null;
 try{db=window.claude?await window.claude.use("db"):null}catch(e){db=null}
 if(!db){setStatus("local");return}
 cloudDb=db;setStatus("cloud");
 db.collection("runs").orderBy("ts","desc").limit(500).onSnapshot(snap=>{
  runs=snap.docs.map(d=>d.data());
  cacheLocal();updateCount();
  if(!$("v-list").hidden)renderList();
  if(!$("v-photos").hidden)renderPhotoLines();
 },err=>{toast("Sync interrupted — showing last known data")});
 db.collection("photos").orderBy("uploadedAt","desc").limit(1000).onSnapshot(snap=>{
  photos=snap.docs.map(d=>d.data());
  cleanupOldPhotos();
  if(!$("v-photos").hidden)renderPhotoLines();
  if(!$("v-photo-line").hidden&&currentLine)renderPhotoLine(currentLine);
 },err=>{toast("Photo sync interrupted")});
}
async function cleanupOldPhotos(){
 if(cleanupRan||!cloudDb||!assetsApi)return;
 cleanupRan=true;
 const now=Date.now();
 const stale=photos.filter(p=>p.uploadedAt&&(now-p.uploadedAt)>PHOTO_MAX_AGE_MS);
 for(const p of stale){
  try{await assetsApi.delete(p.assetId)}catch(e){}
  try{await cloudDb.collection("photos").doc(p.id).delete()}catch(e){}
 }
}
function allLines(){
 const set=new Set();
 runs.forEach(r=>{if(r.line)set.add(r.line)});
 photos.forEach(p=>{if(p.line)set.add(p.line)});
 return Array.from(set).sort();
}
function renderPhotoLines(){
 const q=$("pq").value.trim().toUpperCase();
 const all=allLines();
 const lines=all.filter(l=>!q||l.includes(q));

async function compressImage(file,maxDim,quality){
 maxDim=maxDim||1920;quality=quality||0.8;
 let bitmap;
 try{bitmap=await createImageBitmap(file,{imageOrientation:"from-image"})}
 catch(e){bitmap=await new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{res(img);URL.revokeObjectURL(url)};img.onerror=rej;img.src=url})}
 let w=bitmap.width,h=bitmap.height;
 if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim}else{w=Math.round(w*maxDim/h);h=maxDim}}
 const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
 canvas.getContext("2d").drawImage(bitmap,0,0,w,h);
 return await new Promise(res=>canvas.toBlob(res,"image/jpeg",quality));
}
async function blobSha256(blob){
 const buf=await blob.arrayBuffer();
 const digest=await crypto.subtle.digest("SHA-256",buf);
 return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function addPhotosForLine(line,kind,files){

 toast("Uploading "+list.length+" photo"+(list.length>1?"s":"")+"…");
 let okCount=0,dupCount=0;
 const seen=new Set(photos.filter(p=>p.line===line&&p.kind===kind&&p.hash).map(p=>p.hash));
 for(const file of list){
  try{
   const blob=await compressImage(file);
   const hash=await blobSha256(blob).catch(()=>null);
   if(hash&&seen.has(hash)){dupCount++;continue}
   const res=await assetsApi.upload(blob);
   const id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2,8);
   const doc={id,assetId:res.id,line,kind,uploadedAt:Date.now(),hash:hash||null};
   await cloudDb.collection("photos").doc(id).set(doc);
   photos.unshift(doc);
   if(hash)seen.add(hash);
   okCount++;
   if(!$("v-photo-line").hidden&&currentLine===line)renderPhotoLine(line);
  }catch(e){toast("A photo failed to upload")}
 }
 if(okCount&&dupCount)toast(okCount+" added, "+dupCount+" duplicate"+(dupCount>1?"s":"")+" skipped");

function durationMs(r){
 if(!r.date_on||!r.launched||!r.date_off||!r.received)return null;
 const start=new Date(r.date_on+"T"+r.launched);
 const end=new Date(r.date_off+"T"+r.received);
 if(isNaN(start)||isNaN(end))return null;
 const ms=end-start;
 if(ms<0)return null;
 return ms;
}
function durationText(r){

 if(ms===null)return "—";

 const hours=Math.floor(totalMin/60);
 const mins=totalMin%60;
 return hours+"h "+mins+"m";
}

function avgSpeedText(r){

 const dist=parseNum(r.dist);
 if(ms===null||ms<=0||!isFinite(dist)||dist<=0)return "—";
 const mps=dist/(ms/1000);
 return mps.toFixed(2)+" m/s";
}
function calcText(k,r){

function speedOverExpected(r){

function maskProject(el){
 const caret=el.selectionStart;
 const digitsBefore=(el.value.slice(0,caret).match(/\d/g)||[]).length;
 const digits=el.value.replace(/\D/g,"").slice(0,10);
 let out=digits.slice(0,1);
 if(digits.length>1)out+="-"+digits.slice(1,5);
 if(digits.length>5)out+="-"+digits.slice(5,10);
 el.value=out;
 let count=0,pos=0;
 for(;pos<out.length;pos++){if(count>=digitsBefore)break;if(/\d/.test(out[pos]))count++}
 el.setSelectionRange(pos,pos);
}
function maskRnum(el){

 const L=$("list");
 if(!res.length){L.innerHTML="<div class='empty'>"+(runs.length?"No matches found":"No runs yet. Add your first one on the New Run tab.")+"</div>";return}
 L.innerHTML=res.map(r=>{const dr=r.date_on?esc(r.date_on)+(r.date_off&&r.date_off!==r.date_on?" – "+esc(r.date_off):""):"";
  return "<div class='item' data-id='"+r.id+"'><div class='item-del' data-id='"+r.id+"'>Delete</div><div class='item-body"+(r.complete==="y"?" complete":" incomplete")+"' data-id='"+r.id+"'>"+(r.line?"<button type='button' class='item-photo-btn' data-line='"+esc(r.line)+"' aria-label='Photos for this line'>📷</button>":"")+"<b>"+esc(r.project)+"</b> "+esc(r.line)+(r.equip?" · "+esc(r.equip):"")+(r.complete==="y"?" <span class='badge-ok'>Complete</span>":" <span class='badge-no'>Incomplete</span>")+"<small>"+esc(r.client)+(dr?" · "+dr:"")+(r.operator?" · "+esc(r.operator):"")+"</small><small>"+(r.dist?esc(r.dist)+" m":"")+(r.data?" · "+esc(r.data)+" "+esc(r["data-unit"]||"GB"):"")+"</small></div></div>"}).join("")}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shareText(){
 const r=read();
 const lines=[];
 F.forEach(([k,l,t,u])=>{
  if(t==="dnum"){if(r[k])lines.push(l+": "+r[k]+" "+(r[k+"-unit"]||u[0]))}
  else if(t==="num"){if(r[k])lines.push(l+": "+r[k]+(u?" "+u:""))}
  else if(t==="yn"){if(r[k])lines.push(l+": "+(r[k]==="y"?"Yes":"No"))}
  else if(t==="calc"){const d=calcText(k,r);if(d!=="—")lines.push(l+": "+d+(k==="avgspeed"&&speedOverExpected(r)?" ⚠ above expected":""))}
  else if(r[k])lines.push(l+": "+r[k]);
 });
 return lines.join("\n");
}
async function copyToClipboard(text){
 try{await navigator.clipboard.writeText(text);return true}catch(e){return false}
}
let lastShareText="";
async function openShare(){
 const t=shareText();
 if(!t.trim()){toast("Fill in the run details first");return}
 const withLink=t;
 lastShareText=withLink;
 const r=read();
 const subj="RORUN — "+(r.project||"Run");
 $("sh-wa").href="https://wa.me/?text="+encodeURIComponent(withLink);
 $("sh-teams").href="https://teams.microsoft.com/share?msgText="+encodeURIComponent(t);
 $("sh-mail").href="mailto:?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(withLink);
 $("sheet-back").hidden=false;
}
function closeShare(){$("sheet-back").hidden=true}
$("sheet-back").addEventListener("click",e=>{if(e.target.id==="sheet-back")closeShare()});
$("sh-cancel").onclick=closeShare;
$("sh-wa").addEventListener("click",closeShare);
$("sh-teams").addEventListener("click",closeShare);
$("sh-mail").addEventListener("click",closeShare);
$("sh-copy").onclick=async()=>{
 closeShare();
 if(await copyToClipboard(lastShareText))toast("Copied to clipboard");
 else toast("Could not copy")};
$("del-back").addEventListener("click",e=>{if(e.target.id==="del-back")closeDel()});
$("del-cancel").onclick=closeDel;
$("del-confirm").onclick=()=>{const id=pendingDeleteId;closeDel();if(id)deleteRunById(id)};
$("q").oninput=renderList;
$("qf").onchange=renderList;
let swipeState=null,lastDragEnd=0;
function closeOpenItems(except){document.querySelectorAll(".item-body.open").forEach(b=>{if(b!==except){b.style.transform="";b.classList.remove("open")}})}
$("list").addEventListener("touchstart",e=>{
 const body=e.target.closest(".item-body");if(!body)return;
 closeOpenItems(body);
 const t=e.touches[0];
 swipeState={body,startX:t.clientX,startY:t.clientY,dx:body.classList.contains("open")?-84:0,dragging:false};
},{passive:true});
$("list").addEventListener("touchmove",e=>{
 if(!swipeState)return;
 const t=e.touches[0];
 const dx=t.clientX-swipeState.startX,dy=t.clientY-swipeState.startY;
 if(!swipeState.dragging){
  if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
  if(Math.abs(dy)>Math.abs(dx)){swipeState=null;return}
  swipeState.dragging=true;
 }
 e.preventDefault();
 const openBase=swipeState.body.classList.contains("open")?-84:0;
 let x=openBase+dx;if(x>0)x=0;if(x<-104)x=-104;
 swipeState.dx=x;
 swipeState.body.style.transform="translateX("+x+"px)";
},{passive:false});
$("list").addEventListener("touchend",()=>{
 if(!swipeState)return;
 const {body,dragging,dx}=swipeState;
 if(dragging){
  lastDragEnd=Date.now();
  if(dx<-42){body.style.transform="translateX(-84px)";body.classList.add("open")}
  else{body.style.transform="";body.classList.remove("open")}
 }
 swipeState=null;
});
$("list").onclick=e=>{
 if(Date.now()-lastDragEnd<300)return;
 const delBtn=e.target.closest(".item-del");
 if(delBtn){confirmDeleteRun(delBtn.dataset.id);return}
 const photoBtn=e.target.closest(".item-photo-btn");
 if(photoBtn){openPhotoLine(photoBtn.dataset.line);return}
 const body=e.target.closest(".item-body");if(!body)return;
 if(body.classList.contains("open")){body.style.transform="";body.classList.remove("open");return}
 const it=e.target.closest(".item");if(!it)return;
 const r=runs.find(x=>x.id===it.dataset.id);if(!r)return;
 editId=r.id;fill(r);$("save").textContent="Save Changes";$("delete").hidden=false;show("new")};
$("emailxl").onclick=async()=>{
 if(!cloudDb){toast("Cloud sync required to email a report");return}
 if(!runs.length){toast("No runs to export yet");return}
 const btn=$("emailxl");btn.disabled=true;const old=btn.textContent;btn.textContent="Requesting…";
 try{
  const id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2,8);
  await cloudDb.collection("xlsx_requests").doc(id).set({id,status:"pending",requestedAt:Date.now()});
  toast("Requested — within the hour a Gmail draft with the report will be waiting for you to send");
 }catch(e){toast("Could not send the request — try again later")}
 btn.disabled=false;btn.textContent=old;
};
build();fill(lastDefaults());buildSearchFilter();updateCount();initCloud();show("home");
</script>
