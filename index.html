<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RORUN</title>
<meta name="description" content="ILI run log — record launch, receive and pigging data for pipeline inspection runs.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0073bc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RORUN">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b141d;--card:#2e3d4f;--ink:#f2f6f9;--mute:#9fb0c0;--line:#3f5268;--acc:#0073bc;--acc-ink:#fff;--acc-t:#5ab4ec;--head:#a9c4e0;--brand:#fff;--warm:#e0a92a;--ok:#4fc38a;--no:#e2766d;--abh:56px;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{color-scheme:light;--bg:#eef1f3;--card:#fff;--ink:#1b2a33;--mute:#64757f;--line:#d3dbe0;--acc:#0073bc;--acc-t:#0073bc;--head:#375578;--brand:#144f9b;--warm:#c98a00;--ok:#1f7a4d;--no:#a83a32}
html{scroll-padding-top:calc(var(--abh) + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Barlow","DIN Next LT W02",-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:12px 14px 40px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;position:sticky;top:calc(var(--abh) + env(safe-area-inset-top,0px));background:var(--bg);padding:8px 0;z-index:2}
nav[hidden]{display:none}
nav button{flex:1 1 calc(50% - 6px);min-width:84px;padding:12px 6px;border:0;background:var(--card);color:var(--ink);border-radius:4px;font:inherit;font-weight:500;font-size:14px}
nav button[aria-selected="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.appbar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:var(--abh) 1fr var(--abh);align-items:center;height:calc(var(--abh) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:var(--acc);color:#fff}
.ab-title{margin:0;text-align:center;font-size:22px;font-weight:600;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-btn{width:var(--abh);height:var(--abh);display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#fff;padding:0}
.ab-btn[hidden]{display:flex;visibility:hidden}
.ab-btn svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ab-title .brand-o{border-color:#fff}
.brand-o{display:inline-block;width:.74em;height:.74em;border-radius:50%;border:.15em solid currentColor;position:relative;margin:0 .01em;box-sizing:border-box;flex:none}
.brand-o::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-42%,-50%);width:0;height:0;border-style:solid;border-width:.15em 0 .15em .24em;border-color:transparent transparent transparent #d7182f}
.home-grid{display:grid;gap:14px;margin-top:6px}
.home-logo{display:block;max-width:140px;width:36%;margin:34px auto 0;opacity:.55;filter:brightness(0) invert(1)}
.home-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:158px;padding:24px 14px;border:0;background:var(--card);color:var(--ink);border-radius:8px;font:inherit}
.home-glyph{width:58px;height:58px;fill:#fff;display:block}
.home-label{font-size:21px;font-weight:700}
.home-count{position:absolute;top:10px;right:10px;min-width:28px;text-align:center;background:var(--acc);color:var(--acc-ink);border-radius:4px;padding:3px 8px;font-size:13px;font-weight:700}
.me-info{padding:2px 4px 12px;font-size:14px;color:var(--ink);word-break:break-all}
fieldset{border:1px solid var(--line);background:var(--card);border-radius:8px;margin:0 0 12px;padding:8px 14px 14px}
legend{font-weight:600;padding:0 6px;color:var(--head)}
.f{margin-top:10px;position:relative}
.suggest-list{display:none;position:absolute;left:0;right:0;top:100%;margin-top:2px;background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.18);max-height:190px;overflow-y:auto;z-index:30}
.suggest-list.show{display:block}
.suggest-list button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.suggest-list button:last-child{border-bottom:0}
.suggest-list button:active{background:var(--bg)}
.f>label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.f .hint{font-size:12px;color:var(--mute);margin-top:4px}
.f.err input{border-color:var(--no)}
.row2{display:flex;gap:10px;margin-top:10px}
.row2>.f{flex:1;min-width:0;margin-top:0}
.f.err .hint{color:var(--no)}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,.q{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
.f select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
.calc-display{width:100%;padding:11px 12px;border:1px dashed var(--line);border-radius:4px;background:var(--bg);color:var(--acc-t);font:inherit;font-weight:600;box-sizing:border-box}
.calc-display.gauge-red,.gauge-line.gauge-red{color:#fff;background:var(--no);border-color:var(--no);border-style:solid}
.calc-display.gauge-orange,.gauge-line.gauge-orange{color:#1b1b1b;background:var(--warm);border-color:var(--warm);border-style:solid}
.calc-display.gauge-green,.gauge-line.gauge-green{color:#fff;background:var(--ok);border-color:var(--ok);border-style:solid}
.gauge-line{display:inline-block;padding:2px 8px;border-radius:10px;font-weight:600;margin-top:4px}
.calc-display.calc-warn{color:var(--no);border-color:var(--no);border-style:solid}
.line-item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:8px;cursor:pointer}
.line-count{color:var(--mute);font-size:13px}
.pl-back{margin-bottom:10px}
.pl-title{margin:0 0 14px;font-size:20px}
.photo-kind-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.photo-kind-tabs button{flex:1;min-width:80px;padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:4px;font:inherit;font-size:13px}
.photo-kind-tabs button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.kind-section{margin:16px 0}
.kind-section-title{font-weight:600;color:var(--acc-t);margin-bottom:8px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.photo-grid:empty{display:none}
.photo-grid:empty::after{content:"No photos yet";grid-column:1/-1}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:4px;background-size:cover;background-position:center;background-color:var(--bg);border:1px solid var(--line);cursor:pointer}
.photo-del{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--no);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;font-weight:700;cursor:pointer}
.photo-add{width:100%;margin-bottom:14px}
.photo-view-back{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:14px}
.photo-view-back[hidden]{display:none}
.photo-view-back img{max-width:94vw;max-height:80vh;object-fit:contain;border-radius:4px}
.photo-view-back button{padding:10px 20px;border:1px solid #fff;border-radius:4px;background:transparent;color:#fff;font:inherit}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc-t);outline-offset:1px}
.row{display:flex;gap:8px;align-items:stretch}
.now{flex:none;padding:0 14px;border:1px solid var(--warm);color:var(--warm);background:transparent;border-radius:4px;font:inherit;font-weight:500}
.yn{display:flex;gap:6px}
.yn button{flex:1;padding:7px 4px;border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:4px;font:inherit;font-size:13px}
.yn button[aria-pressed="true"][data-v="y"]{background:var(--ok);border-color:var(--ok);color:#fff}
.yn button[aria-pressed="true"][data-v="n"]{background:var(--no);border-color:var(--no);color:#fff}
.unit{display:flex;align-items:center;gap:8px}.unit span{color:var(--mute);min-width:32px}.unit input{flex:1;min-width:0}
.ut{display:flex;gap:4px;flex:none}
.ut button{padding:0 12px;border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:4px;font:inherit;font-size:14px}
.ut button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.save{width:100%;padding:14px;border:0;border-radius:4px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:600;font-size:17px}
.ghost{padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;font:inherit}
.share-btn{width:100%;margin-top:8px;padding:14px;font-size:16px;font-weight:500}
.photos-btn{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--acc-t);border-color:var(--acc)}
.photos-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.danger-btn{width:100%;margin-top:8px;padding:14px;font-size:16px;font-weight:500;color:var(--no);border-color:var(--no)}
.toggle-btn{width:100%;margin-top:8px;padding:14px;border:2px solid var(--line);background:var(--card);color:var(--mute);border-radius:4px;font:inherit;font-weight:600;font-size:16px}
.toggle-btn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.badge-ok{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:20px;background:var(--ok);color:#fff;font-size:11px;font-weight:600;vertical-align:middle}
.sheet-back{position:fixed;inset:0;background:rgba(15,20,24,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet-back[hidden]{display:none}
.sheet{width:100%;max-width:640px;background:var(--card);border-radius:10px 10px 0 0;padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet .grabber{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 14px}
.sheet h3{margin:0 0 12px;font-size:14px;font-weight:500;color:var(--mute)}
.sheet a,.sheet button{width:100%;display:flex;align-items:center;gap:12px;padding:13px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;text-align:left;text-decoration:none;box-sizing:border-box}
.sheet a .ic,.sheet button .ic{width:30px;height:30px;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600}
.sheet .cancel{margin-top:4px;background:transparent;border:none;color:var(--mute);justify-content:center;font-weight:500}
.item{position:relative;border-radius:8px;margin-bottom:8px;overflow:hidden}
.item b{font-weight:600}.item small{display:block;color:var(--mute)}
.item-del{position:absolute;top:0;right:0;bottom:0;width:84px;background:var(--no);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.item-body{position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 84px 12px 14px;cursor:pointer;transition:transform .18s ease;touch-action:pan-y;box-sizing:border-box}
.item-photo-btn{position:absolute;top:10px;right:10px;height:32px;min-width:36px;padding:0 9px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--mute);font:inherit;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;z-index:1}
.item-photo-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.item-photo-btn.has{background:var(--acc);border-color:var(--acc);color:#fff}
.item-body.complete{border-left:4px solid var(--ok)}
.item-body.incomplete{border-left:4px solid var(--no)}
.badge-no{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:20px;background:var(--no);color:#fff;font-size:11px;font-weight:600;vertical-align:middle}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.bar .q{flex:1;min-width:120px}
.qf{flex:none;padding:11px 10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.msg{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none}
.msg.on{opacity:1}
.status{font-size:12px;color:var(--mute);text-align:center;margin:-6px 0 12px}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;background:var(--mute)}
.status.cloud .dot{background:var(--ok)}
.status.local .dot{background:var(--warm)}
@media (prefers-reduced-motion:reduce){.msg{transition:none}}
.login-back{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.login-back[hidden]{display:none}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px 22px;box-sizing:border-box}
.login-card h2{margin:0 0 4px;text-align:center;color:var(--brand);display:flex;align-items:center;justify-content:center;font-stretch:condensed}
.login-card .sub{color:var(--mute);text-align:center;margin-bottom:20px;font-size:14px}
.login-err{color:var(--no);font-size:13px;margin-top:8px;min-height:16px}
.badge-lock{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:20px;background:var(--mute);color:#fff;font-size:11px;font-weight:600;vertical-align:middle}
.item-body.readonly{cursor:default}
.readonly-banner{background:var(--warm);color:#1b2a33;padding:10px 14px;border-radius:4px;margin-bottom:12px;font-weight:600;font-size:14px;text-align:center}
.readonly-banner[hidden]{display:none}
.readonly-form .yn button,.readonly-form .ut button,.readonly-form #complete,.readonly-form input,.readonly-form select,.readonly-form textarea,.readonly-form .now{pointer-events:none;opacity:.75}
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .45s ease}
.splash.off{opacity:0;pointer-events:none}
.splash img{width:min(58vw,280px);height:auto;border-radius:22%;box-shadow:0 10px 40px rgba(0,0,0,.45);opacity:0;transform:scale(.94);animation:splashIn .7s ease-out .05s forwards}
@keyframes splashIn{to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.splash,.splash img{transition:none;animation:none;opacity:1;transform:none}}
.photo-thumb.pending{opacity:.72;border:2px dashed var(--warm)}
.photo-thumb.pending::after{content:"⏳";position:absolute;left:4px;bottom:2px;font-size:14px}
.pl-pending{background:var(--card);border:1px dashed var(--warm);color:var(--warm);border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.pl-pending[hidden]{display:none}
.pic-warn-msg{display:none;color:var(--warm);font-size:12px;margin-top:4px}
.pic-warn .pic-warn-msg{display:block}
.pic-warn .yn{outline:1px solid var(--warm);border-radius:4px}
.warn-line{color:var(--warm)!important;font-weight:600}
.actions{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.actions>button{width:auto;margin:0;padding:8px 6px;min-height:40px;font-size:13px;font-weight:600;border-radius:6px;border-width:1px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.actions>#complete,.actions>#save,.actions>#rerun,.actions>#delete{grid-column:span 3}
.actions>#share,.actions>#formphotos,.actions>#formpdf{grid-column:span 2}
.actions>.photos-btn svg{width:16px;height:16px}
.actions>#complete{border-width:1px}
.tech-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.tech-chips .tech-lbl{color:var(--mute);font-size:12px;margin-right:2px}
.tech-chips[hidden]{display:none}
.tech-chips button{padding:6px 11px;border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:14px;font:inherit;font-size:12px}
.tech-chips button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.tech-title{font-size:12px;font-weight:600;color:var(--mute);margin:8px 0 6px}
.pl-tools{display:flex;gap:8px;margin:-6px 0 10px}
.pl-tools[hidden]{display:none}
.pl-tools .ghost{padding:7px 14px;font-size:13px}
.pl-tools .ghost[hidden]{display:none}
.photo-thumb.sel{outline:3px solid var(--acc-t);outline-offset:-3px}
.sel-mark{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.4);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.photo-thumb.sel .sel-mark{background:var(--acc)}
.sel-bar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;gap:6px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.sel-bar[hidden]{display:none}
.sel-bar span{flex:1;font-size:13px;color:var(--mute)}
.sel-bar button{padding:9px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;font:inherit;font-size:13px;font-weight:600}
.sel-bar button:disabled{opacity:.4}
body.has-selbar{padding-bottom:84px}
.pv-tech{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;color:#fff;font-size:13px;max-width:94vw}
.pv-tech[hidden]{display:none}
.photo-view-back .pv-tech button{padding:6px 11px;border-radius:14px;font-size:13px;background:transparent}
.photo-view-back .pv-tech button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc)}
</style>
</head>

 catch(e){bitmap=await new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{res(img);URL.revokeObjectURL(url)};img.onerror=rej;img.src=url})}
 let w=bitmap.width,h=bitmap.height;
 if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim}else{w=Math.round(w*maxDim/h);h=maxDim}}
 const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;

const QDB={
 db:null,
 open(){
  if(this.db)return Promise.resolve(this.db);
  return new Promise((res,rej)=>{
   if(!window.indexedDB){rej(new Error("no idb"));return}
   const r=indexedDB.open("rorun-queue",1);
   r.onupgradeneeded=()=>{r.result.createObjectStore("q",{keyPath:"qid"})};
   r.onsuccess=()=>{this.db=r.result;res(r.result)};
   r.onerror=()=>rej(r.error);
  });
 },
 async tx(mode,fn){
  const db=await this.open();
  return new Promise((res,rej)=>{
   const t=db.transaction("q",mode);const st=t.objectStore("q");
   const rq=fn(st);
   t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  });
 },
 all(){return this.tx("readonly",s=>s.getAll())},
 put(it){return this.tx("readwrite",s=>s.put(it))},

 if(t==="yn")h+="<div class='yn' data-k='"+k+"'><button type='button' data-v='y'>Yes</button><button type='button' data-v='n'>No</button></div>"+(PIC_KIND[k]?"<div class='pic-warn-msg'>⚠ Marked Yes, but no "+kindLabel(PIC_KIND[k])+" photo found for this line</div>":"");
 else if(t==="time")h+="<div class='row'><input type='time' id='f-"+k+"'><button type='button' class='now' data-now='"+k+"'>Now</button></div>";
 else if(t==="num")h+="<div class='unit'><input type='text' inputmode='decimal' id='f-"+k+"'><span>"+u+"</span></div>";
 else if(t==="dnum")h+="<div class='unit'><input type='text' inputmode='decimal' id='f-"+k+"'><div class='ut' data-k='"+k+"-unit'>"+u.map(o=>"<button type='button' data-v='"+o+"'>"+o+"</button>").join("")+"</div></div>";
 else if(t==="area")h+="<textarea id='f-"+k+"' rows='3'></textarea>";
 else if(t==="sel")h+="<select id='f-"+k+"'><option value=''>Select…</option>"+u.map(o=>"<option value='"+o+"'>"+o+"</option>").join("")+"</select>";
 else if(t==="calc")h+="<div class='calc-display' id='f-"+k+"'>—</div>";
 else h+="<input type='"+(t==="date"?"date":"text")+"' id='f-"+k+"' "+(t==="text"?"autocapitalize='characters' autocomplete='off'":"")+(k==="project"?" inputmode='numeric'":"")+(k==="rnum"?" maxlength='3'":"")+(VALID[k]?" placeholder='"+VALID[k].ex+"'":"")+">";
 if(SUGGEST_KEYS.includes(k))h+="<div class='suggest-list' id='sg-"+k+"'></div>";
 if(VALID[k])h+="<div class='hint'>"+VALID[k].hint+"</div>";
 return h;
}

function nextRunNo(base){
 let max=0;
 activeRunsArr().forEach(x=>{
  if(x.line===base.line&&x.project===base.project&&x.equip===base.equip){
   const m=/^R(\d{1,2})$/.exec(x.rnum||"");if(m)max=Math.max(max,+m[1]);
  }
 });
 const own=/^R(\d{1,2})$/.exec(base.rnum||"");
 const n=Math.max(max,own?+own[1]:0)+1;
 return n>99?"":"R"+n;
}

function maskProject(el){
 const caret=el.selectionStart;
 const digitsBefore=(el.value.slice(0,caret).match(/\d/g)||[]).length;
 const digits=el.value.replace(/\D/g,"").slice(0,10);
 let out=digits.slice(0,1);
 if(digits.length>1)out+="-"+digits.slice(1,5);
 if(digits.length>5)out+="-"+digits.slice(5,10);
 el.value=out;
 let count=0,pos=0;
 for(;pos<out.length;pos++){if(count>=digitsBefore)break;if(/\d/.test(out[pos]))count++}
 el.setSelectionRange(pos,pos);
}
function maskRnum(el){
 const digits=el.value.replace(/\D/g,"").slice(0,2);
 el.value="R"+digits;
 el.setSelectionRange(el.value.length,el.value.length);
}

async function submit(){
 const arr=activeRunsArr();
 if(editId){
  const existing=arr.find(x=>x.id===editId);
  if(existing&&!canEdit(existing)){toast("You can only edit your own runs");return}
 }
 const r=read();
 if(r.line){
  if(hasPhoto(r.line,"launcher"))r.lpic="y";
  if(hasPhoto(r.line,"receiver"))r.rpic="y";
 }
 if(!r.project){toast("Enter a project number");$("f-project").focus();return}
 if(!validateField("project")){toast("Project doesn't match the required format");$("f-project").focus();return}
 if(r.line&&!validateField("line")){toast("Line ID doesn't match the required format");$("f-line").focus();return}
 if(r.rnum&&!validateField("rnum")){toast("Run No. doesn't match the required format");$("f-rnum").focus();return}
 if(editId){
  const i=arr.findIndex(x=>x.id===editId);
  r.id=editId;r.ts=i>-1?arr[i].ts:Date.now();
  r.ownerUid=i>-1?(arr[i].ownerUid||null):(currentUser?currentUser.uid:null);
 }else{
  r.id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2,8);
  r.ts=Date.now();
  r.ownerUid=currentUser?currentUser.uid:null;
 }
 const i=arr.findIndex(x=>x.id===r.id);
 if(i>-1)arr[i]=r;else arr.unshift(r);
 cacheLocal(activeType);updateCounts();
 const wasEdit=!!editId;
 let savedOffline=false;
 const collName=activeCollName();
 if(cloudDb){
  try{const w=await withTimeout(cloudDb.collection(collName).doc(r.id).set(r),4000);if(w==="timeout")savedOffline=true}
  catch(e){toast("Saved locally — cloud sync failed")}
 }
 toast(savedOffline?"Saved on this phone — will sync when online":(wasEdit?"Changes saved":"Run saved"));
 editId=null;$("save").textContent="Save Run";$("delete").hidden=true;fill(lastDefaults());show("list");renderList();
}

 let x=openBase+dx;if(x>0)x=0;if(x<-104)x=-104;

function exportXlsx(){
 const arr=activeRunsArr();
 if(!arr.length){toast("No runs to export yet");return}
 const isClp=activeType==="clp";
 const cols=isClp?XLSX_COLUMNS_CLP:XLSX_COLUMNS_ILI;
 const extraHeaders=["Run duration","Average velocity (m/s)"].concat(isClp?["ID Difference (mm)","Margin to ILI Min ID (mm)","Gauge plate status"]:["Above expected velocity?","Distance Difference (m)"]);
 const header=cols.map(c=>c[0]).concat(extraHeaders);
 const rows=arr.map(r=>{
  const row=cols.map(([label,key,kind])=>{
   if(kind==="number"){const n=parseNum(r[key]);return isFinite(n)?n:""}
   if(kind==="yn")return r[key]==="y"?"Yes":r[key]==="n"?"No":"";
   if(kind==="data")return r.data?(parseNum(r.data)||r.data)+" "+(r["data-unit"]||"GB"):"";
   return r[key]||"";
  });
  const ms=durationMs(r);
  row.push(ms===null?"":durationText(r));
  const avgTxt=avgSpeedText(r);
  row.push(avgTxt==="—"?"":parseFloat(avgTxt));
  if(isClp){
   const idTxt=idDiffText(r);
   row.push(idTxt==="—"?"":parseFloat(idTxt));
   const g=gaugeInfo(r);
   row.push(g?g.margin:"");
   row.push(g?({red:"RED",orange:"ORANGE",green:"GREEN"}[g.level]+" - "+g.label):"");
  }else{
   row.push(speedOverExpected(r)?"Yes":"No");
   const diffTxt=distDiffText(r);
   row.push(diffTxt==="—"?"":parseFloat(diffTxt));
  }
  return row;
 });
 const ws=XLSX.utils.aoa_to_sheet([header,...rows]);
 ws["!cols"]=header.map(()=>({wch:16}));
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,isClp?"CLP-GP Runs":"Runs");
 const stamp=new Date().toISOString().slice(0,10);
 XLSX.writeFile(wb,(isClp?"RORUN_CLPGP_export_":"RORUN_export_")+stamp+".xlsx");
}

/* ---------- PDF line report (no external library; pages are drawn on canvas and packed into a PDF) ---------- */
function makePdf(pages){
 const enc=new TextEncoder();const parts=[];let len=0;const offs=[];
 const push=d=>{const u=typeof d==="string"?enc.encode(d):d;parts.push(u);len+=u.length};
 push("%PDF-1.4\n%âãÏÓ\n");
 const n=pages.length;
 const obj=(num,body)=>{offs[num]=len;push(num+" 0 obj\n");push(body);push("\nendobj\n")};
 obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
 obj(2,"<< /Type /Pages /Kids ["+pages.map((_,i)=>(3+3*i)+" 0 R").join(" ")+"] /Count "+n+" >>");
 pages.forEach((pg,i)=>{
  const pn=3+3*i,cn=pn+1,im=pn+2;
  obj(pn,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 "+im+" 0 R >> >> /Contents "+cn+" 0 R >>");
  const cs="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
  obj(cn,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
  offs[im]=len;
  push(im+" 0 obj\n<< /Type /XObject /Subtype /Image /Width "+pg.w+" /Height "+pg.h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+pg.jpeg.length+" >>\nstream\n");
  push(pg.jpeg);push("\nendstream\nendobj\n");
 });
 const total=3+3*n;
 const xrefPos=len;
 let x="xref\n0 "+total+"\n0000000000 65535 f \n";
 for(let k=1;k<total;k++)x+=String(offs[k]).padStart(10,"0")+" 00000 n \n";
 push(x);
 push("trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xrefPos+"\n%%EOF");
 return new Blob(parts,{type:"application/pdf"});
}
async function loadBitmap(blob){
 try{return await createImageBitmap(blob)}
 catch(e){
  return await new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});
 }
}
async function buildLineReport(line,onProgress,opts){
 const PXW=1400,PXH=1980,MM=PXW/210;           // px per mm, A4
 const PW=210,PH=297,M=14,CW=PW-2*M;
 const INK="#1e2832",MUTE="#6e7882",BLUE="#0073bc",OK="#1f8f5f",NO="#c0463e",WARM="#b9770e",PANEL="#eef3f8",RULE="#c9d3dc";
 const FONT='"Helvetica Neue",Helvetica,Arial,sans-serif';
 const pdfPages=[];
 let cv=null,ctx=null,y=0,pageNo=0;
 const pt=v=>v*0.3528*MM;                       // font points -> px
 function font(size,bold){ctx.font=(bold?"700 ":"400 ")+pt(size)+"px "+FONT}
 function T(text,x,yy,o){
  o=o||{};font(o.size||9.5,o.bold);ctx.fillStyle=o.color||INK;ctx.textAlign=o.align||"left";ctx.textBaseline="alphabetic";
  let t=String(text==null?"":text);
  if(o.maxW){while(t.length>1&&ctx.measureText(t).width>o.maxW*MM)t=t.slice(0,-1);}
  ctx.fillText(t,x*MM,yy*MM);
 }
 function wrap(text,maxW,size,bold){
  font(size,bold);const out=[];
  String(text).split(/\r?\n/).forEach(par=>{
   const words=par.split(/\s+/).filter(Boolean);let cur="";
   if(!words.length){out.push("");return}
   words.forEach(w=>{
    const tryLine=cur?cur+" "+w:w;
    if(ctx.measureText(tryLine).width>maxW*MM&&cur){out.push(cur);cur=w}else cur=tryLine;
   });
   out.push(cur);
  });
  return out;
 }
 function rule(yy,color,w){ctx.strokeStyle=color||RULE;ctx.lineWidth=(w||0.25)*MM;ctx.beginPath();ctx.moveTo(M*MM,yy*MM);ctx.lineTo((PW-M)*MM,yy*MM);ctx.stroke()}
 async function finishPage(){
  if(!cv)return;
  T("RORUN  ·  Line "+line+"  ·  Page "+pageNo,PW/2,PH-8,{size:7.5,color:MUTE,align:"center"});
  const blob=await new Promise(res=>cv.toBlob(res,"image/jpeg",0.86));
  pdfPages.push({jpeg:new Uint8Array(await blob.arrayBuffer()),w:PXW,h:PXH});
  cv=null;ctx=null;
 }
 async function newPage(){
  await finishPage();
  cv=document.createElement("canvas");cv.width=PXW;cv.height=PXH;ctx=cv.getContext("2d");
  ctx.fillStyle="#fff";ctx.fillRect(0,0,PXW,PXH);pageNo++;y=M;
 }
 async function ensure(h){if(y+h>PH-16)await newPage()}

 await newPage();
 // header
 try{
  const ic=await (await fetch("icon-192.png")).blob();const bm=await loadBitmap(ic);
  ctx.drawImage(bm,M*MM,y*MM,16*MM,16*MM);
 }catch(e){}
 T("Line report",M+20,y+7,{size:18,bold:true});
 T(line,M+20,y+14.5,{size:14,bold:true,color:BLUE});
 const who=currentUser&&currentUser.email?currentUser.email:"";
 T("Generated "+new Date().toLocaleString("en-GB"),PW-M,y+6,{size:8.5,color:MUTE,align:"right"});
 if(who)T(who,PW-M,y+10.5,{size:8.5,color:MUTE,align:"right"});
 y+=21;rule(y,BLUE,0.6);y+=6;

 const sets=[["ili","ILI",runs,ILI_G],["clp","CLP/GP",clpRuns,CLP_G]];
 const repItems=sortItems(opts&&opts.items?opts.items:allItems(line));
 const techSet=new Set(repItems.filter(x=>TECH_KINDS.has(x.kind)&&x.tech).map(x=>x.tech));
 const byTech=!!(opts&&opts.items&&techSet.size);
 const listFor=arr=>arr.filter(r=>r.line===line&&(!byTech||techSet.has(r.equip))).sort((a,b)=>(a.ts||0)-(b.ts||0));
 const nIli=listFor(runs).length,nClp=listFor(clpRuns).length;
 const nPh=repItems.length;
 if(!nIli&&!nClp&&!nPh)return null;
 T("ILI runs: "+nIli+"    CLP/GP runs: "+nClp+"    Photos: "+nPh,M,y,{size:9,color:MUTE});y+=(opts&&opts.items?4.5:7);
 if(opts&&opts.items){T("Report built from "+nPh+" selected photo"+(nPh===1?"":"s")+(byTech?" — runs limited to: "+Array.from(techSet).join(", "):""),M,y,{size:8.5,color:MUTE});y+=6}

 const valueOf=(k,t,u,r)=>{
  if(t==="yn")return r[k]==="y"?"Yes":r[k]==="n"?"No":"";
  if(t==="num")return r[k]?r[k]+(u?" "+u:""):"";
  if(t==="dnum")return r[k]?r[k]+" "+(r[k+"-unit"]||u[0]):"";
  if(t==="calc"){const c=calcText(k,r);return c==="—"?"":c}
  return r[k]||"";
 };
 const prevType=activeType;
 const colW=CW/2;
 try{
  for(const [type,label,arr,groups] of sets){
   for(const r of listFor(arr)){
    activeType=type;
    await ensure(60);
    // title bar
    ctx.fillStyle=PANEL;ctx.fillRect(M*MM,y*MM,CW*MM,9*MM);
    T(label+" RUN"+(r.rnum?"   "+r.rnum:"")+(r.equip?"   ·   "+r.equip:""),M+3,y+6.2,{size:11,bold:true});
    T(r.complete==="y"?"Complete":"Incomplete",PW-M-3,y+6,{size:9,bold:true,color:r.complete==="y"?OK:NO,align:"right"});
    y+=13;
    const dr=r.date_on?r.date_on+(r.date_off&&r.date_off!==r.date_on?" – "+r.date_off:""):"";
    const meta=[r.project?"Project "+r.project:"",r.client||"",r.operator||"",dr].filter(Boolean).join("   |   ");
    T(meta,M,y,{size:8.5,color:MUTE,maxW:CW});y+=6;
    for(const [gname,fields] of groups){
     const items=[];
     fields.forEach(([k,l,t,u])=>{
      if(["project","client","line","rnum","equip","operator","date_on","date_off","notes"].includes(k))return;
      let v=valueOf(k,t,u,r);
      if(k==="launched"&&r.launched)v=(r.date_on?r.date_on+"  ":"")+r.launched;
      if(k==="received"&&r.received)v=(r.date_off?r.date_off+"  ":"")+r.received;
      if(!v)return;
      if(k==="avgspeed"&&speedOverExpected(r))v+="  (above expected)";
      if(k==="distdiff"&&distShort(r))v+="  (short)";
      const gi=k==="gauge"?gaugeInfo(r):null;
      items.push([l,v,gi?{red:NO,orange:WARM,green:OK}[gi.level]:null]);
     });
     if(!items.length)continue;
     await ensure(14);
     T(gname.toUpperCase(),M,y,{size:7.5,bold:true,color:BLUE});y+=1.6;rule(y,RULE);y+=4.6;
     for(let i=0;i<items.length;i+=2){
      await ensure(6);
      [items[i],items[i+1]].forEach((it,j)=>{
       if(!it)return;const x=M+j*colW;
       T(it[0],x,y,{size:8.5,color:MUTE,maxW:36});
       T(it[1],x+38,y,{size:9.5,bold:true,maxW:colW-40,color:it[2]||undefined});
      });
      y+=5.6;
     }
     y+=1.5;
    }
    if(r.notes){
     const lines=wrap(r.notes,CW-2,9);
     await ensure(10+lines.length*4.6);
     T("NOTES",M,y,{size:7.5,bold:true,color:BLUE});y+=1.6;rule(y,RULE);y+=4.6;
     lines.forEach(ln=>{T(ln,M+1,y,{size:9});y+=4.6});
     y+=1.5;
    }
    y+=5;
   }
  }
 }finally{activeType=prevType}

 // photos
 if(nPh){
  await ensure(40);
  T("Photos",M,y+5,{size:14,bold:true});y+=9;rule(y,BLUE,0.6);y+=6;
  const gap=4,cellW=(CW-2*gap)/3;
  let done=0;
  const sections=[];
  KINDS.forEach(([k,label])=>{
   const its=repItems.filter(x=>x.kind===k);
   if(!its.length)return;
   if(TECH_KINDS.has(k)){
    const groups=[];its.forEach(x=>{if(groups.indexOf(x.tech)<0)groups.push(x.tech)});
    groups.sort((a,b)=>((a===""?1:0)-(b===""?1:0))||a.localeCompare(b));
    groups.forEach(g=>{
     const gi=its.filter(x=>x.tech===g);
     sections.push({title:label+(g?" · "+g:(groups.length>1?" · No technology":""))+" ("+gi.length+")",items:gi});
    });
   }else sections.push({title:label+" ("+its.length+")",items:its});
  });
  for(const sec of sections){
   await ensure(cellW+14);
   T(sec.title,M,y,{size:10.5,bold:true,color:BLUE});y+=5;
   const items=[];
   for(const it of sec.items){
    try{items.push(await loadBitmap(await itemBlob(it)))}catch(e){items.push(null)}
    done++;if(onProgress)onProgress(done,nPh);
   }
   for(let i=0;i<items.length;i+=3){
    const row=items.slice(i,i+3);
    const dims=row.map(bm=>{
     if(!bm)return{w:cellW,h:cellW*0.75};
     let w=cellW,h=cellW*bm.height/bm.width;
     const maxH=cellW*1.45;if(h>maxH){w=w*maxH/h;h=maxH}
     return{w,h};
    });
    const rowH=Math.max.apply(null,dims.map(d=>d.h));
    await ensure(rowH+4);
    row.forEach((bm,j)=>{
     const x=M+j*(cellW+gap);
     if(bm)ctx.drawImage(bm,x*MM,y*MM,dims[j].w*MM,dims[j].h*MM);
     else{ctx.fillStyle=PANEL;ctx.fillRect(x*MM,y*MM,cellW*MM,dims[j].h*MM);T("photo unavailable",x+cellW/2,y+dims[j].h/2,{size:8,color:MUTE,align:"center"})}
    });
    y+=rowH+gap;
   }
   y+=4;
  }
 }
 await finishPage();
 return makePdf(pdfPages);
}

async function makeReport(line,btn,label,opts){

  const blob=await buildLineReport(line,(d,n)=>{btn.textContent="PDF "+d+"/"+n},opts);
