<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RORUN</title>
<meta name="description" content="ILI run log — record launch, receive and pigging data for pipeline inspection runs.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#144f9b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RORUN">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f3;--card:#fff;--ink:#1b2a33;--mute:#64757f;--line:#d3dbe0;--acc:#1395d9;--acc-ink:#fff;--head:#375578;--brand:#144f9b;--warm:#c98a00;--ok:#1f7a4d;--no:#a83a32;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11191e;--card:#1a252c;--ink:#e6edf0;--mute:#8fa1ab;--line:#2d3b44;--acc:#3fb6f0;--acc-ink:#06212e;--head:#8fa9c9;--brand:#5b8fd6;--warm:#e0a92a;--ok:#4fc38a;--no:#e2766d}}
:root[data-theme="dark"]{--bg:#11191e;--card:#1a252c;--ink:#e6edf0;--mute:#8fa1ab;--line:#2d3b44;--acc:#3fb6f0;--acc-ink:#06212e;--head:#8fa9c9;--brand:#5b8fd6;--warm:#e0a92a;--ok:#4fc38a;--no:#e2766d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Barlow","DIN Next LT W02",-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:12px 14px 40px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:2}
nav button{flex:1 1 calc(50% - 6px);min-width:84px;padding:12px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font:inherit;font-weight:500;font-size:14px}
nav button[aria-selected="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.home-title{display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;letter-spacing:.5px;margin:28px 0 2px;text-align:center;color:var(--brand);font-stretch:condensed}
.brand-o{display:inline-block;width:.74em;height:.74em;border-radius:50%;border:.15em solid currentColor;position:relative;margin:0 .01em;box-sizing:border-box;flex:none}
.brand-o::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-42%,-50%);width:0;height:0;border-style:solid;border-width:.15em 0 .15em .24em;border-color:transparent transparent transparent #d7182f}
.home-sub{color:var(--mute);text-align:center;margin-bottom:28px}
.home-grid{display:grid;gap:12px}
.home-logo{display:block;max-width:160px;width:40%;margin:36px auto 0;opacity:.85}
.home-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:30px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit}
.home-ic{font-size:28px;color:var(--acc)}
.home-ic-img{width:30px;height:30px;object-fit:contain;display:block}
.home-label{font-size:17px;font-weight:600}
.home-count{position:absolute;top:10px;right:12px;background:var(--acc);color:var(--acc-ink);border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600}
fieldset{border:1px solid var(--line);background:var(--card);border-radius:6px;margin:0 0 12px;padding:8px 14px 14px}
legend{font-weight:600;padding:0 6px;color:var(--head)}
.f{margin-top:10px;position:relative}
.suggest-list{display:none;position:absolute;left:0;right:0;top:100%;margin-top:2px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.18);max-height:190px;overflow-y:auto;z-index:30}
.suggest-list.show{display:block}
.suggest-list button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.suggest-list button:last-child{border-bottom:0}
.suggest-list button:active{background:var(--bg)}
.f>label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.f .hint{font-size:12px;color:var(--mute);margin-top:4px}
.f.err input{border-color:var(--no)}
.row2{display:flex;gap:10px;margin-top:10px}
.row2>.f{flex:1;min-width:0;margin-top:0}
.f.err .hint{color:var(--no)}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,.q{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.calc-display{width:100%;padding:11px 12px;border:1px dashed var(--line);border-radius:6px;background:var(--bg);color:var(--acc);font:inherit;font-weight:600;box-sizing:border-box}
.calc-display.calc-warn{color:var(--no);border-color:var(--no);border-style:solid}
.line-item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:8px;cursor:pointer}
.line-count{color:var(--mute);font-size:13px}
.pl-back{margin-bottom:10px}
.pl-title{margin:0 0 14px;font-size:20px}
.photo-kind-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.photo-kind-tabs button{flex:1;min-width:80px;padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:6px;font:inherit;font-size:13px}
.photo-kind-tabs button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.kind-section{margin:16px 0}
.kind-section-title{font-weight:600;color:var(--acc);margin-bottom:8px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.photo-grid:empty{display:none}
.photo-grid:empty::after{content:"No photos yet";grid-column:1/-1}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:6px;background-size:cover;background-position:center;background-color:var(--bg);border:1px solid var(--line);cursor:pointer}
.photo-del{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--no);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;font-weight:700;cursor:pointer}
.photo-add{width:100%;margin-bottom:14px}
.photo-view-back{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:14px}
.photo-view-back[hidden]{display:none}
.photo-view-back img{max-width:94vw;max-height:80vh;object-fit:contain;border-radius:6px}
.photo-view-back button{padding:10px 20px;border:1px solid #fff;border-radius:6px;background:transparent;color:#fff;font:inherit}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:8px;align-items:stretch}
.now{flex:none;padding:0 14px;border:1px solid var(--warm);color:var(--warm);background:transparent;border-radius:6px;font:inherit;font-weight:500}
.yn{display:flex;gap:6px}
.yn button{flex:1;padding:7px 4px;border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:6px;font:inherit;font-size:13px}
.yn button[aria-pressed="true"][data-v="y"]{background:var(--ok);border-color:var(--ok);color:#fff}
.yn button[aria-pressed="true"][data-v="n"]{background:var(--no);border-color:var(--no);color:#fff}
.unit{display:flex;align-items:center;gap:8px}.unit span{color:var(--mute);min-width:32px}.unit input{flex:1;min-width:0}
.ut{display:flex;gap:4px;flex:none}
.ut button{padding:0 12px;border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:6px;font:inherit;font-size:14px}
.ut button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.save{width:100%;padding:14px;border:0;border-radius:6px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:600;font-size:17px}
.ghost{padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font:inherit}
.share-btn{width:100%;margin-top:8px;padding:14px;font-size:16px;font-weight:500}
.danger-btn{width:100%;margin-top:8px;padding:14px;font-size:16px;font-weight:500;color:var(--no);border-color:var(--no)}
.toggle-btn{width:100%;margin-top:8px;padding:14px;border:2px solid var(--line);background:var(--card);color:var(--mute);border-radius:6px;font:inherit;font-weight:600;font-size:16px}
.toggle-btn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.badge-ok{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:20px;background:var(--ok);color:#fff;font-size:11px;font-weight:600;vertical-align:middle}
.sheet-back{position:fixed;inset:0;background:rgba(15,20,24,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet-back[hidden]{display:none}
.sheet{width:100%;max-width:640px;background:var(--card);border-radius:10px 10px 0 0;padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet .grabber{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 14px}
.sheet h3{margin:0 0 12px;font-size:14px;font-weight:500;color:var(--mute)}
.sheet a,.sheet button{width:100%;display:flex;align-items:center;gap:12px;padding:13px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;text-align:left;text-decoration:none;box-sizing:border-box}
.sheet a .ic,.sheet button .ic{width:30px;height:30px;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600}
.sheet .cancel{margin-top:4px;background:transparent;border:none;color:var(--mute);justify-content:center;font-weight:500}
.item{position:relative;border-radius:6px;margin-bottom:8px;overflow:hidden}
.item b{font-weight:600}.item small{display:block;color:var(--mute)}
.item-del{position:absolute;top:0;right:0;bottom:0;width:84px;background:var(--no);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.item-body{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 50px 12px 14px;cursor:pointer;transition:transform .18s ease;touch-action:pan-y;box-sizing:border-box}
.item-photo-btn{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--acc);font-size:15px;display:flex;align-items:center;justify-content:center;z-index:1;padding:0}
.item-body.complete{border-left:4px solid var(--ok)}
.item-body.incomplete{border-left:4px solid var(--no)}
.badge-no{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:20px;background:var(--no);color:#fff;font-size:11px;font-weight:600;vertical-align:middle}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.bar .q{flex:1;min-width:120px}
.qf{flex:none;padding:11px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.msg{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
.msg.on{opacity:1}
.status{font-size:12px;color:var(--mute);text-align:center;margin:-6px 0 12px}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;background:var(--mute)}
.status.cloud .dot{background:var(--ok)}
.status.local .dot{background:var(--warm)}
@media (prefers-reduced-motion:reduce){.msg{transition:none}}
.login-back{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.login-back[hidden]{display:none}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px 22px;box-sizing:border-box}
.login-card h2{margin:0 0 4px;text-align:center;color:var(--brand);font-stretch:condensed}
.login-card .sub{color:var(--mute);text-align:center;margin-bottom:20px;font-size:14px}
.login-err{color:var(--no);font-size:13px;margin-top:8px;min-height:16px}
.badge-lock{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:20px;background:var(--mute);color:#fff;font-size:11px;font-weight:600;vertical-align:middle}
.item-body.readonly{cursor:default}
.readonly-banner{background:var(--warm);color:#1b2a33;padding:10px 14px;border-radius:6px;margin-bottom:12px;font-weight:600;font-size:14px;text-align:center}
.readonly-banner[hidden]{display:none}
.readonly-form .yn button,.readonly-form .ut button,.readonly-form #complete,.readonly-form input,.readonly-form select,.readonly-form textarea,.readonly-form .now{pointer-events:none;opacity:.75}
</style>
</head>
<body>
<main>
<nav role="tablist" id="main-nav" hidden><button role="tab" id="t-home" aria-selected="true">Home</button><button role="tab" id="t-new" aria-selected="false">New Run</button><button role="tab" id="t-list" aria-selected="false">Runs (<span id="cnt">0</span>)</button><button role="tab" id="t-photos" aria-selected="false">Photos</button></nav>
<div class="status checking" id="status"><span class="dot"></span>Connecting…</div>
<section id="v-home">
<div class="home-title">R<span class="brand-o"></span>RUN</div>
<div class="home-sub">ILI run log</div>
<div class="home-grid">
 <button type="button" class="home-card" id="home-ili"><span class="home-ic">📋</span><span class="home-label">ILI Runs</span><span class="home-count" id="cnt-ili">0</span></button>
 <button type="button" class="home-card" id="home-clp"><span class="home-ic">🧹</span><span class="home-label">CLP/GP Runs</span><span class="home-count" id="cnt-clp">0</span></button>
 <button type="button" class="home-card" id="home-photos"><img class="home-ic-img" src="photos-icon.png" alt=""><span class="home-label">Photos</span></button>
</div>
<div id="whoami" style="text-align:center;margin-top:14px;font-size:12px;color:var(--mute)"></div>
<img class="home-logo" src="rosen-logo.png" alt="ROSEN">
</section>
<section id="v-new" hidden><div class="readonly-banner" id="readonly-banner" hidden>🔒 View only — you can't edit someone else's run</div><form id="form" onsubmit="return false"></form></section>
<section id="v-photos" hidden>
<div class="bar">
 <input class="q" id="pq" type="search" placeholder="Search Line ID…">
</div>
<div id="photo-lines"></div>
</section>
<section id="v-photo-line" hidden>
<button type="button" class="ghost pl-back" id="pl-back">← Lines</button>
<h2 class="pl-title" id="pl-title"></h2>
<div class="photo-kind-tabs" id="pl-kind-tabs"></div>
<input type="file" accept="image/*" multiple hidden id="pl-file-input">
<button type="button" class="ghost photo-add" id="pl-add" hidden>+ Add Photo</button>
<div id="pl-sections"></div>
</section>
<section id="v-list" hidden>
<div class="bar">
 <select id="qf" class="qf"></select>
 <input class="q" id="q" type="search" placeholder="Search…">
 <button class="ghost" id="emailxl">Export to Excel</button>
</div>
<div id="list"></div>
</section>
</main>
<div class="msg" id="msg"></div>
<div class="sheet-back" id="sheet-back" hidden>
 <div class="sheet">
  <div class="grabber"></div>
  <h3>Share this run via</h3>
  <a id="sh-wa" href="#"><span class="ic" style="background:#25D366">W</span>WhatsApp</a>
  <a id="sh-teams" href="#"><span class="ic" style="background:#5059C9">T</span>Microsoft Teams</a>
  <a id="sh-mail" href="#"><span class="ic" style="background:#0072C6">O</span>Outlook / Email</a>
  <button type="button" id="sh-copy"><span class="ic" style="background:#64757f">C</span>Copy text (for any other app)</button>
  <button type="button" class="cancel" id="sh-cancel">Cancel</button>
 </div>
</div>
<div class="sheet-back" id="del-back" hidden>
 <div class="sheet">
  <div class="grabber"></div>
  <h3>Delete this run? This cannot be undone.</h3>
  <button type="button" id="del-confirm" style="justify-content:center;color:var(--no);border-color:var(--no);font-weight:600">Delete Run</button>
  <button type="button" class="cancel" id="del-cancel">Cancel</button>
 </div>
</div>
<div class="photo-view-back" id="photo-view-back" hidden>
 <img id="photo-view-img" src="">
 <button type="button" id="photo-view-close">Close</button>
</div>
<div class="login-back" id="login-back" hidden>
 <div class="login-card">
  <h2>R<span class="brand-o"></span>RUN</h2>
  <div class="sub">Sign in to continue</div>
  <div class="f"><label for="login-email">Email</label><input type="email" id="login-email" autocomplete="username" autocapitalize="off"></div>
  <div class="f"><label for="login-password">Password</label><input type="password" id="login-password" autocomplete="current-password"></div>
  <div class="login-err" id="login-err"></div>
  <button type="button" class="save" id="login-submit" style="margin-top:6px">Sign In</button>
 </div>
</div>

async function compressImage(file,maxDim,quality){
 maxDim=maxDim||1920;quality=quality||0.8;
 let bitmap;
 try{bitmap=await createImageBitmap(file,{imageOrientation:"from-image"})}
 catch(e){bitmap=await new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{res(img);URL.revokeObjectURL(url)};img.onerror=rej;img.src=url})}
 let w=bitmap.width,h=bitmap.height;
 if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim}else{w=Math.round(w*maxDim/h);h=maxDim}}
 const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
 canvas.getContext("2d").drawImage(bitmap,0,0,w,h);
 return await new Promise(res=>canvas.toBlob(res,"image/jpeg",quality));
}
async function blobSha256(blob){
 const buf=await blob.arrayBuffer();

}

 let okCount=0,dupCount=0;
 const seen=new Set(photos.filter(p=>p.line===line&&p.kind===kind&&p.hash).map(p=>p.hash));
 for(const file of list){
  try{
   const blob=await compressImage(file);
   const hash=await blobSha256(blob).catch(()=>null);
   if(hash&&seen.has(hash)){dupCount++;continue}
   const res=await assetsApi.upload(blob);
   const id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2,8);
   const doc={id,assetId:res.id,url:res.url,line,kind,uploadedAt:Date.now(),hash:hash||null};
   await cloudDb.collection("photos").doc(id).set(doc);
   photos.unshift(doc);

   if(!$("v-photo-line").hidden&&currentLine===line)renderPhotoLine(line);
  }catch(e){toast("A photo failed to upload")}

 const start=new Date(r.date_on+"T"+r.launched);

  const k=e.target.id&&e.target.id.startsWith("f-")?e.target.id.slice(2):null;
  if(k==="line")e.target.value=e.target.value.toUpperCase();
  if(k==="project")maskProject(e.target);
  if(k==="rnum")maskRnum(e.target);
  if(k&&VALID[k])validateField(k);
  if(k&&SUGGEST_KEYS.includes(k))showSuggestions(k,e.target.value);
  if(k==="launched"||k==="date_on"||k==="received"||k==="date_off"||k==="dist"||k==="expspeed"||k==="cdist"||k==="origid"||k==="minid")refreshCalcFields()});
}
function maskProject(el){
 const caret=el.selectionStart;
 const digitsBefore=(el.value.slice(0,caret).match(/\d/g)||[]).length;
 const digits=el.value.replace(/\D/g,"").slice(0,10);
 let out=digits.slice(0,1);
 if(digits.length>1)out+="-"+digits.slice(1,5);
 if(digits.length>5)out+="-"+digits.slice(5,10);
 el.value=out;
 let count=0,pos=0;
 for(;pos<out.length;pos++){if(count>=digitsBefore)break;if(/\d/.test(out[pos]))count++}
 el.setSelectionRange(pos,pos);
}
function maskRnum(el){
 const digits=el.value.replace(/\D/g,"").slice(0,2);
 el.value="R"+digits;
 el.setSelectionRange(el.value.length,el.value.length);
}
function validateField(k){
 const v=$("f-"+k).value.trim();
 const ok=!v||VALID[k].re.test(v);
 $("f-"+k).closest(".f").classList.toggle("err",!ok);
 return ok}
function fill(r){
 F.forEach(([k,,t,u])=>{
  if(t==="yn"){document.querySelectorAll("[data-k='"+k+"'] button").forEach(b=>b.setAttribute("aria-pressed",String(r[k]===b.dataset.v)))}
  else if(t==="dnum"){$("f-"+k).value=r[k]||"";const unit=r[k+"-unit"]||u[0];
   document.querySelectorAll("[data-k='"+k+"-unit'] button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===unit)))}
  else if(t==="calc"){setCalcField(k,r)}
  else{$("f-"+k).value=r[k]||(k==="rnum"?"R":"");if(VALID[k])$("f-"+k).closest(".f").classList.remove("err")}});
 $("complete").setAttribute("aria-pressed",String(r.complete==="y"));
 $("complete").textContent=r.complete==="y"?"✓ Run Complete":"Mark Run Complete";
}
function read(){
 const r={};
 F.forEach(([k,,t,u])=>{
  if(t==="yn"){const p=document.querySelector("[data-k='"+k+"'] [aria-pressed='true']");r[k]=p?p.dataset.v:""}
  else if(t==="dnum"){r[k]=$("f-"+k).value.trim();
   const p=document.querySelector("[data-k='"+k+"-unit'] [aria-pressed='true']");r[k+"-unit"]=p?p.dataset.v:u[0]}
  else if(t==="calc"){}
  else r[k]=$("f-"+k).value.trim()});
 if(r.rnum==="R")r.rnum="";
 r.complete=$("complete").getAttribute("aria-pressed")==="true"?"y":"n";
 return r}
async function setCompleteNow(id,val){
 const arr=activeRunsArr();
 const i=arr.findIndex(x=>x.id===id);
 if(i===-1)return;
 arr[i]=Object.assign({},arr[i],{complete:val?"y":"n"});
 cacheLocal(activeType);
 if(cloudDb){
  try{await cloudDb.collection(activeCollName()).doc(id).set(arr[i])}
  catch(e){toast("Saved locally — cloud sync failed")}
 }
 renderList();
}
async function submit(){
 const arr=activeRunsArr();
 if(editId){
  const existing=arr.find(x=>x.id===editId);
  if(existing&&!canEdit(existing)){toast("You can only edit your own runs");return}
 }
 const r=read();
 if(r.line){
  if(photos.some(p=>p.line===r.line&&p.kind==="launcher"))r.lpic="y";
  if(photos.some(p=>p.line===r.line&&p.kind==="receiver"))r.rpic="y";
 }
 if(!r.project){toast("Enter a project number");$("f-project").focus();return}
 if(!validateField("project")){toast("Project doesn't match the required format");$("f-project").focus();return}
 if(r.line&&!validateField("line")){toast("Line ID doesn't match the required format");$("f-line").focus();return}
 if(r.rnum&&!validateField("rnum")){toast("Run No. doesn't match the required format");$("f-rnum").focus();return}
 if(editId){
  const i=arr.findIndex(x=>x.id===editId);
  r.id=editId;r.ts=i>-1?arr[i].ts:Date.now();
  r.ownerUid=i>-1?(arr[i].ownerUid||null):(currentUser?currentUser.uid:null);
 }else{
  r.id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2,8);
  r.ts=Date.now();
  r.ownerUid=currentUser?currentUser.uid:null;
 }
 const i=arr.findIndex(x=>x.id===r.id);
 if(i>-1)arr[i]=r;else arr.unshift(r);
 cacheLocal(activeType);updateCounts();
 const wasEdit=!!editId;
 const collName=activeCollName();
 if(cloudDb){
  try{await cloudDb.collection(collName).doc(r.id).set(r)}
  catch(e){toast("Saved locally — cloud sync failed")}
 }
 toast(wasEdit?"Changes saved":"Run saved");
 editId=null;$("save").textContent="Save Run";$("delete").hidden=true;fill(lastDefaults());show("list");renderList();
}

async function deleteRunById(id){

 if(existing&&!canEdit(existing)){toast("You can only delete your own runs");return}
 setActiveRunsArr(arr.filter(r=>r.id!==id));
 cacheLocal(activeType);updateCounts();
 if(cloudDb){
  try{await cloudDb.collection(activeCollName()).doc(id).delete()}
  catch(e){toast("Deleted locally — cloud delete failed")}
 }
 toast("Run deleted");
 if(editId===id){editId=null;$("delete").hidden=true;$("save").textContent="Save Run";fill(lastDefaults());show("list")}
 renderList();
}

function renderList(){
 const q=$("q").value.trim().toLowerCase();
 const qf=$("qf").value;
 const src=activeRunsArr();
 const res=src.filter(r=>{
  if(!q)return true;
  if(qf)return String(r[qf]||"").toLowerCase().includes(q);
  return F.some(([k])=>String(r[k]||"").toLowerCase().includes(q));
 });
 const L=$("list");
 if(!res.length){L.innerHTML="<div class='empty'>"+(src.length?"No matches found":"No runs yet. Add your first one on the New Run tab.")+"</div>";return}
 L.innerHTML=res.map(r=>{const dr=r.date_on?esc(r.date_on)+(r.date_off&&r.date_off!==r.date_on?" – "+esc(r.date_off):""):"";
  const editable=canEdit(r);
  return "<div class='item' data-id='"+r.id+"'><div class='item-del' data-id='"+r.id+"'>Delete</div><div class='item-body"+(r.complete==="y"?" complete":" incomplete")+(editable?"":" readonly")+"' data-id='"+r.id+"'>"+(r.line?"<button type='button' class='item-photo-btn' data-line='"+esc(r.line)+"' aria-label='Photos for this line'>📷</button>":"")+"<b>"+esc(r.project)+"</b> "+esc(r.line)+(r.equip?" · "+esc(r.equip):"")+(r.complete==="y"?" <span class='badge-ok'>Complete</span>":" <span class='badge-no'>Incomplete</span>")+(editable?"":" <span class='badge-lock'>🔒 View only</span>")+"<small>"+esc(r.client)+(dr?" · "+dr:"")+(r.operator?" · "+esc(r.operator):"")+"</small><small>"+(r.dist?esc(r.dist)+" m":"")+(r.data?" · "+esc(r.data)+" "+esc(r["data-unit"]||"GB"):"")+"</small></div></div>"}).join("")}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shareText(){
 const r=read();
 const lines=[];
 F.forEach(([k,l,t,u])=>{
  if(t==="dnum"){if(r[k])lines.push(l+": "+r[k]+" "+(r[k+"-unit"]||u[0]))}
  else if(t==="num"){if(r[k])lines.push(l+": "+r[k]+(u?" "+u:""))}
  else if(t==="yn"){if(r[k])lines.push(l+": "+(r[k]==="y"?"Yes":"No"))}
  else if(t==="calc"){const d=calcText(k,r);if(d!=="—")lines.push(l+": "+d+(k==="avgspeed"&&speedOverExpected(r)?" ⚠ above expected":""))}
  else if(r[k])lines.push(l+": "+r[k]);
 });
 return lines.join("\n");
}

let swipeState=null,lastDragEnd=0;
function closeOpenItems(except){document.querySelectorAll(".item-body.open").forEach(b=>{if(b!==except){b.style.transform="";b.classList.remove("open")}})}
$("list").addEventListener("touchstart",e=>{
 const body=e.target.closest(".item-body");if(!body)return;
 if(body.classList.contains("readonly"))return;
 closeOpenItems(body);
 const t=e.touches[0];
 swipeState={body,startX:t.clientX,startY:t.clientY,dx:body.classList.contains("open")?-84:0,dragging:false};
},{passive:true});
$("list").addEventListener("touchmove",e=>{
 if(!swipeState)return;
 const t=e.touches[0];
 const dx=t.clientX-swipeState.startX,dy=t.clientY-swipeState.startY;
 if(!swipeState.dragging){
  if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
  if(Math.abs(dy)>Math.abs(dx)){swipeState=null;return}
  swipeState.dragging=true;
 }
 e.preventDefault();
 const openBase=swipeState.body.classList.contains("open")?-84:0;
 let x=openBase+dx;if(x>0)x=0;if(x<-104)x=-104;
 swipeState.dx=x;
 swipeState.body.style.transform="translateX("+x+"px)";
},{passive:false});
$("list").addEventListener("touchend",()=>{
 if(!swipeState)return;
 const {body,dragging,dx}=swipeState;
 if(dragging){
  lastDragEnd=Date.now();
  if(dx<-42){body.style.transform="translateX(-84px)";body.classList.add("open")}
  else{body.style.transform="";body.classList.remove("open")}
 }
 swipeState=null;
});
$("list").onclick=e=>{
 if(Date.now()-lastDragEnd<300)return;

 if(delBtn){

  if(dr&&!canEdit(dr)){toast("You can only edit your own runs");return}
  confirmDeleteRun(delBtn.dataset.id);return}
 const photoBtn=e.target.closest(".item-photo-btn");
 if(photoBtn){openPhotoLine(photoBtn.dataset.line);return}
 const body=e.target.closest(".item-body");if(!body)return;
 if(body.classList.contains("open")){body.style.transform="";body.classList.remove("open");return}
 const it=e.target.closest(".item");if(!it)return;
 const r=activeRunsArr().find(x=>x.id===it.dataset.id);if(!r)return;
 setActiveSchema(activeType);
 build();
 editId=r.id;

 formReadonly=!editable;

 $("save").hidden=formReadonly;
 if(!formReadonly)$("save").textContent="Save Changes";
 $("delete").hidden=formReadonly;
 show("new")};

 ["Launched","launched","text"],["Date launch","date_on","text"],["BM R","bmr","yn"],["BM Distance run (m)","bmdist_run","number"],
 ["Received","received","text"],["Date receive","date_off","text"],["Pressure receiver (bar)","pr","number"],

const XLSX_COLUMNS_CLP=[

 ["Received","received","text"],["Date receive","date_off","text"],["Pressure receiver (bar)","pr","number"],["Min ID (mm)","minid","number"],

];
function exportXlsx(){
 const arr=activeRunsArr();
 if(!arr.length){toast("No runs to export yet");return}
 const isClp=activeType==="clp";
 const cols=isClp?XLSX_COLUMNS_CLP:XLSX_COLUMNS_ILI;
 const extraHeaders=["Run duration","Average velocity (m/s)"].concat(isClp?["ID Difference (mm)"]:["Above expected velocity?","Distance Difference (m)"]);
 const header=cols.map(c=>c[0]).concat(extraHeaders);
 const rows=arr.map(r=>{
  const row=cols.map(([label,key,kind])=>{
   if(kind==="number"){const n=parseNum(r[key]);return isFinite(n)?n:""}
   if(kind==="yn")return r[key]==="y"?"Yes":r[key]==="n"?"No":"";
   if(kind==="data")return r.data?(parseNum(r.data)||r.data)+" "+(r["data-unit"]||"GB"):"";
   return r[key]||"";
  });
  const ms=durationMs(r);
  row.push(ms===null?"":durationText(r));
  const avgTxt=avgSpeedText(r);
  row.push(avgTxt==="—"?"":parseFloat(avgTxt));
  if(isClp){
   const idTxt=idDiffText(r);
   row.push(idTxt==="—"?"":parseFloat(idTxt));
  }else{
   row.push(speedOverExpected(r)?"Yes":"No");
   const diffTxt=distDiffText(r);
   row.push(diffTxt==="—"?"":parseFloat(diffTxt));
  }
  return row;
 });
 const ws=XLSX.utils.aoa_to_sheet([header,...rows]);
 ws["!cols"]=header.map(()=>({wch:16}));
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,isClp?"CLP-GP Runs":"Runs");
 const stamp=new Date().toISOString().slice(0,10);
 XLSX.writeFile(wb,(isClp?"RORUN_CLPGP_export_":"RORUN_export_")+stamp+".xlsx");
}
$("emailxl").onclick=exportXlsx;
